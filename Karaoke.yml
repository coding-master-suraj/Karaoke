name: AI Vocal Remover Studio

on:
  workflow_dispatch:
    inputs:
      audio_filename:
        description: 'Input Song File Name (Example: song.wav or song.mp3)'
        required: true
        default: 'song.mp3'

jobs:
  separate-audio:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/python-versions@v4
      with:
        python-version: '3.10'

    - name: Install Meta Demucs AI Engine & PyTorch
      run: |
        python -m pip install --upgrade pip
        pip install demucs torch torchaudio

    - name: Process 100% Vocal Removal
      run: |
        echo "Processing file: ${{ github.event.inputs.audio_filename }}"
        demucs -d cpu --two-stems=vocals "${{ github.event.inputs.audio_filename }}"
        
        # Move extracted clean instrumental audio
        mkdir -p output_music
        BASENAME=$(basename "${{ github.event.inputs.audio_filename }}" | cut -f 1 -d '.')
        cp "separated/htdemucs/$BASENAME/no_vocals.wav" "output_music/clean_instrumental.wav"

    - name: Upload Clean Instrumental Audio File
      uses: actions/upload-artifact@v3
      with:
        name: Clean-Instrumental-Track
        path: output_music/clean_instrumental.wav
